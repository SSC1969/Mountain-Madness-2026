[package]
name = "TermFishing"
version = "1.0.0"
edition = "2024"
description = "A small TUI-based fishing game."
license = "GPL-3.0-or-later"

[dependencies]
color-eyre = "0.6.5"
crossterm = { version = "0.29.0", features = ["event-stream"] }
directories = "6.0.0"
futures = "0.3.32"
lazy_static = "1.5.0"
libp2p = { version = "0.56.0", features = ["gossipsub", "macros", "mdns", "noise", "quic", "tcp", "tokio", "yamux"] }
rand = "0.10.0"
rand_distr = "0.6.0"
ratatui = { version = "0.30.0", features = ["serde"] }
rmp-serde = "1.3.1"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
strum = { version = "0.28.0", features = ["derive"] }
tokio = { version = "1.49.0", features = ["full"] }
tracing-subscriber = { version = "0.3.22", features = ["env-filter"] }
tui-input = "0.15.0"

[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

[profile.debugging]
inherits = "dev"
debug = true

